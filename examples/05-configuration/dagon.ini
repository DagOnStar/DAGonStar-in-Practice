; A minimal configuration for local workflows (lecture 05).
; scratch_dir_base is replaced by the example with a temporary directory.
[dagon_service]
use = False
route = http://localhost:57000

[ftp_pub]
ip = localhost

[batch]
scratch_dir_base = /tmp/
run_base =
remove_dir = False
threads = 2

[slurm]
partition =

[loggers]
keys = root

[handlers]
keys = stream_handler

[formatters]
keys = formatter

[logger_root]
level = WARNING
handlers = stream_handler

[handler_stream_handler]
class = StreamHandler
level = WARNING
formatter = formatter
args = (sys.stderr,)

[formatter_formatter]
format = %(asctime)s %(name)-12s %(levelname)-8s %(message)s
